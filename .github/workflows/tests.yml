name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install openpyxl pillow pyyaml
      - name: Run the skill test suite
        run: python dev/tests/run_tests.py
      - name: Check the skill packages (placeholders allowed without org settings)
        run: python dev/package_skill.py --out dist/report-development.zip
